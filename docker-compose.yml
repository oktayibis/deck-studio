services:
  deck-studio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deck-studio-app
    ports:
      - "${PORT:-3456}:3456"
    environment:
      - PORT=3456
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-sqlite://data/deck_studio.sqlite}
      - LLM_PROVIDER=${LLM_PROVIDER:-local-structured}
      - LLM_MODEL=${LLM_MODEL:-deck-architect-v4}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - INTERNAL_NETWORK_ONLY=${INTERNAL_NETWORK_ONLY:-true}
      - FORBID_EXTERNAL_MEDIA=${FORBID_EXTERNAL_MEDIA:-false}
    volumes:
      - deck_studio_data:/app/data
    restart: unless-stopped

  deck-studio-rust-api:
    image: rust:1.83-slim
    container_name: deck-studio-rust-api
    working_dir: /app/backend-rs
    command: cargo run --release
    ports:
      - "${RUST_API_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/deck_studio.sqlite}
      - INTERNAL_NETWORK_ONLY=${INTERNAL_NETWORK_ONLY:-true}
    volumes:
      - ./backend-rs:/app/backend-rs
      - deck_studio_data:/app/data
    restart: unless-stopped

volumes:
  deck_studio_data:
    driver: local
